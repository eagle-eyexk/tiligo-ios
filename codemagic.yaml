workflows:
  ios-release:
    name: TiliGo iOS TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: tiligo_asc
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - code-signing
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Auto-fix missing files
        script: |
          set -e
          [ -f package.json ] || cat > package.json << 'JSON'
          {"name":"tiligo-ios","version":"1.0.0","scripts":{"build":"echo ok"},"dependencies":{"@capacitor/core":"^7.0.0","@capacitor/cli":"^7.0.0","@capacitor/ios":"^7.0.0"}}
          JSON
          [ -f capacitor.config.json ] || cat > capacitor.config.json << 'JSON'
          {"appId":"com.tiligo.tilgo","appName":"TiliGo","webDir":"www","bundledWebRuntime":false}
          JSON
          if [ ! -d www ]; then mkdir -p www; cat > www/index.html << 'HTML'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TiliGo</title></head><body style="margin:0;background:#06060A;"><iframe src="https://tiligo-delivery-flow.base44.app" style="width:100%;height:100vh;border:none;"></iframe></body></html>
          HTML
          fi
          [ -f pubspec.yaml ] || cat > pubspec.yaml << 'YAML'
          name: tiligo_ios
          version: 1.0.0
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          YAML
      - name: Build Capacitor iOS
        script: |
          set -e
          npm install
          npm run build
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          find ios -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' {} \;
          cd ios/App
          pod install --repo-update
          [ -d App.xcworkspace ] || { echo "FATAL: No workspace"; exit 1; }
          cd ../..
      - name: Install signing
        script: |
          set -e
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp signing/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          security create-keychain -p build123 build.keychain 2>/dev/null || true
          security default-keychain -s build.keychain
          security unlock-keychain -p build123 build.keychain
          for p12 in signing/*.p12; do
            security import "$p12" -k build.keychain -P "TWtlyKGh" -T /usr/bin/codesign
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k build123 build.keychain
      - name: Set build number
        script: |
          cd ios/App
          BUILD=\$(( \$(date +%s) - 1700000000 ))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion \$BUILD" App/Info.plist 2>/dev/null || true
      - name: Archive
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath /Users/builder/build/TiliGo.xcarchive DEVELOPMENT_TEAM=H4QUDPK7S3 CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="TiliGo Cert" archive
          test -d /Users/builder/build/TiliGo.xcarchive || { echo "FATAL: Archive failed"; exit 1; }
      - name: Export IPA
        script: |
          cat > /Users/builder/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>H4QUDPK7S3</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.tiligo.tilgo</key>
                  <string>TiliGo Cert</string>
              </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath /Users/builder/build/TiliGo.xcarchive -exportPath /Users/builder/build -exportOptionsPlist /Users/builder/ExportOptions.plist
    artifacts:
      - /Users/builder/build/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
