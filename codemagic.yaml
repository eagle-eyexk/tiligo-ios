workflows:
  ios-release:
    name: TiliGo iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: tiligo_asc
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - tiligo_signing
      vars:
        BUNDLE_ID: com.tiligo.tilgo
        APPLE_TEAM_ID: H4QUDPK7S3
        PROFILE_NAME: "TiliGo Cert"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Capacitor — add & sync iOS
        script: |
          set -euo pipefail
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: CocoaPods install
        script: cd ios/App && pod install --repo-update

      - name: Set build number from timestamp
        script: |
          BUILD_NO=$(date +%s)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NO" ios/App/App/Info.plist

      - name: Import signing certificate
        script: |
          set -euo pipefail
          security create-keychain -p codemagic build.keychain 2>/dev/null || true
          security default-keychain -s build.keychain
          security unlock-keychain -p codemagic build.keychain
          echo "$APPLE_DIST_CERT_B64" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k build.keychain -P "$APPLE_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k codemagic build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISION_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/TiliGo.mobileprovision

      - name: Archive
        script: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/TiliGo.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive | xcpretty

      - name: Export IPA
        script: |
          set -euo pipefail
          cat > /tmp/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>compileBitcode</key><false/>
            <key>uploadBitcode</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/TiliGo.xcarchive" \
            -exportPath "$CM_BUILD_DIR/ipa" \
            -exportOptionsPlist /tmp/ExportOptions.plist | xcpretty

    artifacts:
      - "$CM_BUILD_DIR/ipa/*.ipa"
      - "$CM_BUILD_DIR/TiliGo.xcarchive"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
      email:
        recipients:
          - dev@tiligo.app
        notify:
          success: true
          failure: true
