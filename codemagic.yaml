workflows:
  ios-release:
    name: TiliGo iOS TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: tiligo_asc
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - code-signing
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Bootstrap
        script: |
          set -e
          [ -f package.json ] || cat > package.json << 'JSON'
          {"name":"tiligo-ios","version":"1.0.0","scripts":{"build":"echo ok"},"dependencies":{"@capacitor/core":"^7.0.0","@capacitor/cli":"^7.0.0","@capacitor/ios":"^7.0.0"}}
          JSON
          [ -f capacitor.config.json ] || cat > capacitor.config.json << 'JSON'
          {"appId":"com.tiligo.tilgo","appName":"TiliGo","webDir":"www","bundledWebRuntime":false}
          JSON
          if [ ! -d www ]; then
            mkdir -p www
            cat > www/index.html << 'HTML'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TiliGo</title></head><body style="margin:0;background:#06060A;"><iframe src="https://tili-goo.base44.app" style="width:100%;height:100vh;border:none;"></iframe></body></html>
          HTML
          fi
      - name: Install dependencies
        script: npm install
      - name: Build web
        script: npm run build
      - name: Generate iOS project
        script: |
          set -e
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          find ios -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' {} \;
          cd ios/App
          pod install --repo-update
          [ -d App.xcworkspace ] || { echo "FATAL: Workspace missing"; exit 1; }
          cd ../..
      - name: Set build number
        script: |
          cd ios/App
          BUILD=$(( $(date +%s) - 1700000000 ))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" App/Info.plist 2>/dev/null || true
      - name: Archive
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath /Users/builder/build/TiliGo.xcarchive \
            DEVELOPMENT_TEAM=H4QUDPK7S3 \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="TiliGo Cert" \
            archive
          test -d /Users/builder/build/TiliGo.xcarchive
      - name: Export IPA
        script: |
          cat > /Users/builder/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>H4QUDPK7S3</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.tiligo.tilgo</key>
                  <string>TiliGo Certt</string>
              </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath /Users/builder/build/TiliGo.xcarchive \
            -exportPath /Users/builder/build \
            -exportOptionsPlist /Users/builder/ExportOptions.plist
    artifacts:
      - /Users/builder/build/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      
