<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <!-- iOS App Icon — uses TiliGo logo -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://media.base44.com/images/public/user_69e68678ce0d9fdef245009b/8f0358955_IMG_0105.jpeg"/>
  <link rel="apple-touch-icon" sizes="152x152" href="https://media.base44.com/images/public/user_69e68678ce0d9fdef245009b/8f0358955_IMG_0105.jpeg"/>
  <link rel="apple-touch-icon" sizes="120x120" href="https://media.base44.com/images/public/user_69e68678ce0d9fdef245009b/8f0358955_IMG_0105.jpeg"/>
  <link rel="apple-touch-startup-image" href="https://media.base44.com/images/public/user_69e68678ce0d9fdef245009b/8f0358955_IMG_0105.jpeg"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="TiliGo"/>
  <meta name="theme-color" content="#39FF6B"/>
  <title>TiliGo</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; background:#06060A; overflow:hidden; }
    #frame { border:none; width:100%; height:100%; display:block; position:fixed; top:0; left:0; }
  </style>
</head>
<body>
  <iframe
    id="frame"
    src="https://tiligo-delivery-flow.base44.app"
    allow="geolocation *; notifications *; camera *; microphone *; push *"
    allowfullscreen>
  </iframe>
  <script>
    // Request notification permission on load
    if ('Notification' in window && Notification.permission === 'default') {
      document.getElementById('frame').addEventListener('load', function() {
        setTimeout(() => Notification.requestPermission(), 2000);
      });
    }
    // iOS safe area padding
    document.documentElement.style.setProperty('--sat', 'env(safe-area-inset-top)');
    document.documentElement.style.setProperty('--sab', 'env(safe-area-inset-bottom)');
  </script>
</body>
</html>
